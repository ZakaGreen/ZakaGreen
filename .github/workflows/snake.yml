name: Update contribution snake

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#a94a35
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e9d4af

      - name: Publish SVGs to the output branch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            let parent;
            let baseTree;
            try {
              const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/output' });
              parent = ref.data.object.sha;
              const commit = await github.rest.git.getCommit({ owner, repo, commit_sha: parent });
              baseTree = commit.data.tree.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const files = ['github-snake.svg', 'github-snake-dark.svg'];
            const tree = await github.rest.git.createTree({
              owner, repo,
              ...(baseTree ? { base_tree: baseTree } : {}),
              tree: files.map(path => ({
                path, mode: '100644', type: 'blob',
                content: fs.readFileSync(`dist/${path}`, 'utf8')
              }))
            });
            if (tree.data.sha === baseTree) return;
            const commit = await github.rest.git.createCommit({
              owner, repo, message: 'Update contribution snake',
              tree: tree.data.sha, parents: parent ? [parent] : []
            });
            if (parent) {
              await github.rest.git.updateRef({
                owner, repo, ref: 'heads/output', sha: commit.data.sha, force: false
              });
            } else {
              await github.rest.git.createRef({
                owner, repo, ref: 'refs/heads/output', sha: commit.data.sha
              });
            }
